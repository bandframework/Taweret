name: Check Code Standard Adherence
env:
  CLONE_PATH: ${{ github.workspace }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # TODO: Remove this once OpenBT is officially in it's new PyPI project
      # space.
      - name: Checkout OpenBT repository
        uses: actions/checkout@v6
        with:
          repository: bandframework/OpenBT
          path: ${{ env.CLONE_PATH }}/OpenBT
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenMPI
        run: |
             sudo apt-get update
             sudo apt-get -y install openmpi-bin libopenmpi-dev
      - name: Setup base Python environment
        run: |
          $CLONE_PATH/.github/workflows/setup_base_python.sh ${{ runner.os }}
      - name: Check coding standards
        run: |
          pushd $CLONE_PATH
          OPENBT_PATH=$CLONE_PATH/OpenBT tox -r -e check
          popd
