name: Build & publish Jupyter book
env:
  CLONE_PATH:    ${{ github.workspace }}
  EXAMPLES_BOOK: ${{ github.workspace }}/book/_build/html
on:
  push:
    # TODO: Issue #117.  Should this publish for every commit on main or only on
    # release events on main?  If only release events, then the test_book action
    # should also be run on pushes to main that aren't release events.
    branches:
      - main 
    workflow_dispatch:

jobs:
  # This failed with Python 3.14 with semaphore lock failures in the
  # multiprocessing package.
  build:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v7
    # TODO: Remove this once OpenBT is officially in it's new PyPI project
    # space.
    - name: Checkout OpenBT repository
      uses: actions/checkout@v6
      with:
        repository: bandframework/OpenBT
        path: ${{ env.CLONE_PATH }}/OpenBT

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version}}

    - name: Install OpenMPI
      run: |
           sudo apt-get update
           sudo apt-get -y install openmpi-bin libopenmpi-dev

    - name: Setup python with tox
      run: |
        $CLONE_PATH/.github/workflows/setup_base_python.sh ${{ runner.os }}

    - name: Build Jupyter Book
      run: |
        which mpirun || echo "Cannot find the MPI installation"
        which mpicxx || echo "Cannot find the MPI compiler wrapper"
        mpicxx -show || echo "Cannot check the MPI wrapper specification"
        echo " "
        pushd $CLONE_PATH
        OPENBT_PATH=$CLONE_PATH/OpenBT tox -r -e book
        popd

    - name: Archive examples Jupyter book 
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ env.EXAMPLES_BOOK }}

    - name: Publish Taweret Jupyter Book
      id: deployment
      uses: actions/deploy-pages@v5
