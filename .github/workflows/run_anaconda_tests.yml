name: Test in Anaconda
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    #####----- RUN FULL TEST SUITE WITHOUT COVERAGE
    # Test through actual installations for end-to-end testing including
    # packaging.
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04,
             macos-14, macos-15, macos-26, macos-26-intel]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    env:
      CLONE_PATH: ${{ github.workspace }}
    steps:
      # Following GH action messages, we explicitly remove the defaults channels
      # setting.  According to the setup-miniconda docs, this is related to a
      # workaround for
      #            https://github.com/conda/conda/issues/12356
      - uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          auto-update-conda: true
          channels: conda-forge
          conda-remove-defaults: true
      - name: Checkout Taweret
        uses: actions/checkout@v6
      # TODO: Remove this once OpenBT is officially in it's new PyPI project
      # space.
      - name: Checkout OpenBT repository
        uses: actions/checkout@v6
        with:
          repository: bandframework/OpenBT
          path: ${{ env.CLONE_PATH }}/OpenBT
      - name: Setup miniconda & log
        shell: bash -el {0}
        run: |
          which python
          python --version
          conda info
          conda list
          conda install pip
          python -m pip install build
          conda list
      - name: Install prebuilt Open MPI via PyPI
        shell: bash -el {0}
        run: |
          python -m pip install openmpi
          conda list
          which mpicxx || echo "Cannot find the MPI installation"
          mpicxx -show || echo "Cannot check the MPI wrapper specification"
      - name: Run tests without coverage
        shell: bash -el {0}
        run: |
          pushd $CLONE_PATH
          # Since the package is pure Python, the binary wheel should be
          # universal.  Therefore, all pip installs from PyPI should get the
          # wheel rather than the source distribution and we test the wheel.
          # TODO: Remove this once OpenBT is officially in it's new PyPI project
          python -m pip install $CLONE_PATH/OpenBT/openbt_pypkg
          python -m build --wheel
          python -m pip install dist/[Tt]aweret-*-py3-none-any.whl
          popd
          python -c "import Taweret ; print(Taweret.__version__) ; exit(not Taweret.test())"
